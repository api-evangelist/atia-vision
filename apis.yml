aid: atia-vision
name: Atia Vision
description: >-
  Atia Vision, Inc. is a clinical-stage ophthalmic medical device company headquartered in
  Campbell, California, and a portfolio company of the Shifamed medical innovation hub. It
  develops the OmniVu modular shape-changing intraocular lens (IOL) — a two-part implant
  pairing a fluid-filled, shape-changing base with an exchangeable fixed-power front optic —
  designed to work with the eye's natural accommodative mechanism to restore a full range of
  functional vision in cataract patients, and implanted using conventional cataract surgical
  technique. The company raised a $20M Series D and a $42M Series E, and in May 2025 the U.S.
  Food and Drug Administration granted it an Investigational Device Exemption to begin a
  feasibility clinical study of the OmniVu Lens System; the device is investigational and is
  not approved for sale or use in the United States. Atia Vision is an implantable-device
  manufacturer: it publishes no developer program, no public API, and no machine-readable
  specification.
